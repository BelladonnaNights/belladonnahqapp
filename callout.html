<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can't Make It — Belladonna</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700&family=Josefin+Sans:wght@200;300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000; --surface: #0d0d0d; --surface2: #141414; --surface3: #1a1a1a;
    --border: rgba(180,150,100,0.16); --border2: rgba(180,150,100,0.32);
    --gold: #c9a96e; --rose2: #b0505a;
    --text: #f0ece0; --text2: #b0a890; --text3: #8a8272;
    --live: #3aaa6a; --live-dim: rgba(58,170,106,0.15);
    --purple-btn: #c9a96e;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Josefin Sans', sans-serif; font-weight: 300; min-height: 100vh; padding: 2rem 1rem; letter-spacing: 0.04em; }
  .form-wrap { max-width: 480px; margin: 0 auto; }
  .form-header { text-align: center; margin-bottom: 2.5rem; position: relative; padding-bottom: 1.5rem; }
  .form-header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .brand { font-family:'Bebas Neue',sans-serif; font-size:2.0rem; font-weight:400; color:var(--text); letter-spacing:0.06em; text-transform: uppercase; padding-right: 0.14em; }
  .form-subtitle { font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--text3); margin-top: 0.3rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), var(--rose2), transparent); }
  .field { margin-bottom: 1.4rem; }
  .field-label { font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text3); display: block; margin-bottom: 0.5rem; }
  .field-input, .field-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.75rem 1rem; font-size: 0.82rem; font-family: 'Josefin Sans', sans-serif; font-weight: 300; letter-spacing: 0.05em; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .field-input:focus, .field-textarea:focus { border-color: var(--gold); }
  .field-input::placeholder, .field-textarea::placeholder { color: var(--text3); }
  .field-textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .venue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .venue-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.8rem; font-size: 0.72rem; color: var(--purple-btn); cursor: pointer; text-align: center; transition: all 0.2s; letter-spacing: 0.05em; font-family: 'Josefin Sans', sans-serif; line-height: 1.3; }
  .venue-chip:hover { border-color: var(--border2); color: var(--text); }
  .venue-chip.selected { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.08); }
  .add-venue-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .add-venue-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.6rem 0.9rem; font-size: 0.75rem; font-family: 'Josefin Sans', sans-serif; outline: none; transition: border-color 0.2s; letter-spacing: 0.05em; }
  .add-venue-input:focus { border-color: var(--gold); }
  .add-venue-input::placeholder { color: var(--text3); }
  .add-btn { background: rgba(201,169,110,0.15); border: 1px solid var(--gold); color: var(--purple-btn); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.7rem; cursor: pointer; font-family: 'Josefin Sans', sans-serif; font-weight: 400; letter-spacing: 0.1em; transition: all 0.2s; white-space: nowrap; }
  .add-btn:hover { background: rgba(201,169,110,0.25); color: var(--text); }
  .divider { height: 1px; background: var(--border); margin: 1.2rem 0; }
  .required { color: var(--rose2); margin-left: 2px; }
  .time-now-btn { display: inline-block; margin-top: 0.5rem; font-size: 0.65rem; font-family: 'Josefin Sans', sans-serif; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; color: var(--purple-btn); background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.3); border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer; transition: all 0.2s; }
  .time-now-btn:hover { background: rgba(201,169,110,0.2); color: var(--text); }
  .status-toggle { display: flex; gap: 0.5rem; }
  .status-btn { flex: 1; padding: 0.8rem; border-radius: 8px; font-size: 0.7rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; font-family: 'Josefin Sans', sans-serif; transition: all 0.2s; border: 1px solid var(--border2); background: var(--surface2); color: var(--purple-btn); }
  .status-btn:hover { color: var(--text); border-color: rgba(201,169,110,0.5); }
  .status-btn.active-sel { border-color: var(--live); color: var(--purple-btn); background: rgba(58,170,106,0.15); }
  .status-btn.inactive-sel { border-color: var(--rose2); color: var(--purple-btn); background: rgba(176,80,112,0.15); }
  .submit-btn { width: 100%; background: rgba(201,169,110,0.1); border: 1px solid var(--gold); color: var(--purple-btn); padding: 1rem; border-radius: 8px; font-size: 0.72rem; font-weight: 400; letter-spacing: 0.35em; text-transform: uppercase; cursor: pointer; font-family: 'Josefin Sans', sans-serif; transition: all 0.25s; margin-top: 0.5rem; }
  .submit-btn:hover { background: rgba(201,169,110,0.2); color: var(--text); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { border-radius: 8px; padding: 0.9rem 1rem; font-size: 0.75rem; letter-spacing: 0.05em; margin-top: 1rem; display: none; line-height: 1.5; }
  .msg-success { background: var(--live-dim); border: 1px solid rgba(58,170,106,0.3); color: #6edd9a; }
  .msg-error { background: rgba(176,80,112,0.12); border: 1px solid rgba(176,80,112,0.3); color: #d07090; }
  :root{--gold2:#e0bc7e;--border-gold:rgba(201,169,110,0.4);--text4:#4a4638;--gold-dim:rgba(201,169,110,0.12);}
  /* additions */
  .submit-btn:hover,.confirm-btn:hover,.seg-btn:hover{background:rgba(201,169,110,0.2);color:var(--text);}
  .submit-btn:disabled,.confirm-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .gig{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.7rem;}
  .gig-t{font-size:.9rem;color:var(--text);letter-spacing:.05em;} .gig-s{font-size:.72rem;color:var(--text3);margin-top:.25rem;letter-spacing:.06em;}
  .gig-tag{display:inline-block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--border2);color:var(--gold);border-radius:6px;padding:.15rem .5rem;margin-top:.5rem;}
  .gig .submit-btn{margin-top:.8rem;padding:.7rem;font-size:.65rem;}
  .warn-btn{border-color:var(--rose2);} .empty{color:var(--text3);font-size:.78rem;text-align:center;padding:1rem 0;}
  .sec{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--text3);margin:1.4rem 0 .7rem;}
  .big{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--text);text-align:center;line-height:1.3;margin:.3rem 0 .2rem;}
  .detail{text-align:center;color:var(--text2);font-size:.82rem;line-height:1.8;letter-spacing:.06em;margin-bottom:1.2rem;}
  .back{display:block;text-align:center;margin-top:1.4rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);text-decoration:none;}

  .sugg{position:relative;} .sugg-list{position:absolute;left:0;right:0;top:100%;z-index:20;margin-top:4px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.6);}
  .sugg-item{padding:.65rem 1rem;font-size:.78rem;letter-spacing:.05em;color:var(--text2);cursor:pointer;border-bottom:1px solid var(--border);} .sugg-item:last-child{border-bottom:none;} .sugg-item:hover,.sugg-item.act{background:rgba(201,169,110,.12);color:var(--text);} .sugg-item small{display:block;font-size:.62rem;color:var(--text3);letter-spacing:.1em;margin-top:.15rem;}
  .datebtn{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer;} .datebtn span:last-child{color:var(--gold);font-size:.7rem;}
  .cal{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.8rem;margin-top:.5rem;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;} .cal-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--text);letter-spacing:.06em;}
  .cal-nav{background:none;border:1px solid var(--border);color:var(--gold);border-radius:8px;width:2rem;height:2rem;cursor:pointer;font-size:1rem;line-height:1;} .cal-nav:hover{border-color:var(--gold);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;} .cal-dow{font-size:.55rem;letter-spacing:.15em;color:var(--text3);text-align:center;padding:.2rem 0;text-transform:uppercase;}
  .cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--text3);border-radius:8px;border:1px solid transparent;background:none;font-family:inherit;cursor:default;padding:0;}
  .cal-day.has{color:var(--text);cursor:pointer;background:rgba(201,169,110,.08);} .cal-day.has::after{content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--gold);} .cal-day.has:hover{border-color:var(--gold);}
  .cal-day.today{border-color:var(--border2);} .cal-day.sel{background:rgba(201,169,110,.28);border-color:var(--gold);color:var(--text);}
  .cal-foot{display:flex;justify-content:space-between;margin-top:.6rem;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);} .cal-foot button{background:none;border:none;color:var(--gold);cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;}
</style></head><body>
<div class="form-wrap">
  <div class="form-header"><div class="brand">Belladonna</div><div class="form-subtitle" style="font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.14em;color:var(--gold2);margin-top:.15rem">Can't Make It</div></div>
  <div class="card" id="card"><div class="empty">Loading…</div></div>
  <a class="back" href="host-hub.html">‹ Back to Host Hub</a>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCIfAE1JGHsUGzzVH2pz1Vyj5b5OhA0tDQ",authDomain:"belladonna-hq.firebaseapp.com",projectId:"belladonna-hq",storageBucket:"belladonna-hq.firebasestorage.app",messagingSenderId:"1021873183587",appId:"1:1021873183587:web:def283bb7b5ca48e4f9156"});
const auth=firebase.auth(), fs=firebase.firestore(), fns=firebase.functions();
const GATEWAY_APP_KEY='shifts';
const GW='https://belladonnanights.github.io/belladonna-gateway/accounts.html?return='+encodeURIComponent(location.href)+'&app='+GATEWAY_APP_KEY;
const card=document.getElementById('card');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function pDate(k){const p=String(k).split('-');if(p.length<3)return k;return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function todayKey(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}
function errText(e){return (e&&e.message)?e.message.replace(/^.*?:\s*(?=[A-Z])/,''):'Something went wrong.';}
function say(html){card.innerHTML=html;}
auth.onAuthStateChanged(async user=>{
  if(!user){location.href=GW;return;}
  try{
    const s=await fs.collection('users').doc(user.uid).get();
    const me=s.exists?s.data():{};
    if(me.status==='banned'){say('<div class="empty">This account is currently restricted.</div>');return;}
    if(me.accountType!=='host'&&me.role!=='admin'){say('<div class="empty">This page is for host accounts.</div>');return;}
    start(user,me);
  }catch(e){say('<div class="empty">Could not load your account. Please refresh.</div>');}
});


const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');
const keyOf=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
async function start(user,me){
  const isAdmin=me.role==='admin';
  const today=todayKey();
  let shifts=[],showAll=false,selDate='',qText='',calOpen=false,calMonth=new Date(+today.slice(0,4),+today.slice(5,7)-1,1),suggIdx=-1;
  async function load(){
    const r=(await fns.httpsCallable('listMyShifts')({all:showAll})).data;
    shifts=r.shifts||[];
  }
  try{await load();}catch(e){say('<div class="empty">Could not load your shifts. '+esc(errText(e))+'</div>');return;}
  say('<div class="detail" style="margin-bottom:.4rem">Find the shift you can\'t make. Every opted-in host in your area gets a text, and the first one to claim it takes the shift.</div>'+
    '<div class="sec">Today</div><div id="today"></div>'+
    '<div class="sec">Find a shift</div>'+
    '<div class="field"><label class="field-label">Date</label><button type="button" class="field-input datebtn" id="datebtn"><span id="datelabel">Any date</span><span>▾</span></button><div id="cal"></div></div>'+
    '<div class="field sugg"><label class="field-label" for="qt">Venue or night</label><input type="text" class="field-input" id="qt" placeholder="Start typing a venue…" autocomplete="off"><div id="sugg"></div></div>'+
    (isAdmin?'<label style="font-size:.7rem;color:var(--text3);display:block;margin-bottom:1rem"><input type="checkbox" id="qa"> Show all hosts\' shifts (admin)</label>':'')+
    '<div id="results"></div><div class="msg" id="msg"></div>');
  const $=id=>document.getElementById(id);
  const msg=(t,ok)=>{const m=$('msg');m.className='msg '+(ok?'msg-success':'msg-error');m.textContent=t;m.style.display='block';m.scrollIntoView({block:'nearest'});};
  const card1=g=>'<div class="gig"><div class="gig-t">'+esc(g.venue||'Venue')+'</div><div class="gig-s">'+esc(pDate(g.date))+(g.time?' · '+esc(fmtT(g.time)):'')+(g.kind?' · '+esc(g.kind):'')+(showAll&&g.host?' · '+esc(g.host):'')+'</div>'+
    (g.openCalloutId?'<span class="gig-tag">Open — hosts texted</span><button class="submit-btn" data-cancel="'+g.openCalloutId+'">Cancel — I can make it</button>':
    '<button class="submit-btn warn-btn" data-gig="'+esc(g.key)+'">I can\'t make this one</button>')+'</div>';
  function fmtT(t){const m=/^(\d{1,2}):(\d{2})/.exec(t||'');if(!m)return t;let h=+m[1];const ap=h>=12?'PM':'AM';h=h%12||12;return h+(m[2]==='00'?'':':'+m[2])+' '+ap;}
  function renderToday(){const t=shifts.filter(g=>g.date===today);$('today').innerHTML=t.length?t.map(card1).join(''):'<div class="empty" style="padding:.3rem 0">No shifts today.</div>';}
  function renderResults(){
    let res=null;
    if(selDate||qText){res=shifts.filter(g=>(!selDate||g.date===selDate)&&(!qText||norm(g.venue+' '+g.kind).includes(norm(qText))));}
    $('results').innerHTML=res===null?'<div class="empty">Pick a date or type a venue to see shifts.</div>':
      (res.length?res.slice(0,30).map(card1).join('')+(res.length>30?'<div class="empty">Showing the first 30 — narrow it down.</div>':''):'<div class="empty">No shifts match that.</div>');
  }
  function renderCal(){
    if(!calOpen){$('cal').innerHTML='';return;}
    const y=calMonth.getFullYear(),m=calMonth.getMonth();
    const has={};shifts.forEach(g=>{if((!qText||norm(g.venue+' '+g.kind).includes(norm(qText))))has[g.date]=1;});
    const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
    let cells='';['S','M','T','W','T','F','S'].forEach(d=>cells+='<div class="cal-dow">'+d+'</div>');
    for(let i=0;i<first;i++)cells+='<div></div>';
    for(let d=1;d<=dim;d++){const k=keyOf(y,m,d);cells+='<button type="button" class="cal-day'+(has[k]?' has':'')+(k===today?' today':'')+(k===selDate?' sel':'')+'" '+(has[k]?'data-d="'+k+'"':'disabled')+'>'+d+'</button>';}
    $('cal').innerHTML='<div class="cal"><div class="cal-head"><button type="button" class="cal-nav" data-nav="-1">‹</button><div class="cal-title">'+MONTHS[m]+' '+y+'</div><button type="button" class="cal-nav" data-nav="1">›</button></div><div class="cal-grid">'+cells+'</div><div class="cal-foot"><span>● = you have a shift</span><button type="button" id="calclear">Clear date</button></div></div>';
  }
  function setDate(k){selDate=k;$('datelabel').textContent=k?pDate(k):'Any date';calOpen=false;renderCal();renderResults();}
  function renderSugg(){
    const q=norm(qText),seen={},list=[];
    shifts.forEach(g=>{const n=g.venue;if(!n||seen[n])return;seen[n]=1;if(!q||norm(n+' '+g.kind).includes(q))list.push(g);});
    const box=$('sugg');
    if(!list.length||document.activeElement!==$('qt')||(list.length===1&&norm(list[0].venue)===q)){box.innerHTML='';return;}
    suggIdx=Math.min(suggIdx,list.length-1);
    box.innerHTML='<div class="sugg-list">'+list.slice(0,6).map((g,i)=>'<div class="sugg-item'+(i===suggIdx?' act':'')+'" data-v="'+esc(g.venue)+'">'+esc(g.venue)+'<small>'+esc(g.kind||'')+'</small></div>').join('')+'</div>';
  }
  $('datebtn').onclick=()=>{calOpen=!calOpen;if(calOpen&&selDate)calMonth=new Date(+selDate.slice(0,4),+selDate.slice(5,7)-1,1);renderCal();};
  $('cal').addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.nav){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(+t.dataset.nav),1);renderCal();}
    else if(t.dataset.d){setDate(t.dataset.d);}
    else if(t.id==='calclear'){setDate('');}
  });
  const qt=$('qt');
  qt.addEventListener('input',()=>{qText=qt.value;suggIdx=-1;renderSugg();renderResults();if(calOpen)renderCal();});
  qt.addEventListener('focus',()=>{suggIdx=-1;renderSugg();});
  qt.addEventListener('keydown',e=>{
    const items=[...document.querySelectorAll('.sugg-item')];
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();suggIdx=(suggIdx+1)%items.length;renderSugg();}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();suggIdx=(suggIdx-1+items.length)%items.length;renderSugg();}
    else if(e.key==='Enter'&&suggIdx>=0&&items[suggIdx]){e.preventDefault();pick(items[suggIdx].dataset.v);}
    else if(e.key==='Escape'){$('sugg').innerHTML='';}
  });
  function pick(v){qText=v;qt.value=v;suggIdx=-1;$('sugg').innerHTML='';renderResults();if(calOpen)renderCal();qt.blur();}
  $('sugg').addEventListener('mousedown',e=>{const it=e.target.closest('.sugg-item');if(it){e.preventDefault();pick(it.dataset.v);}});
  qt.addEventListener('blur',()=>setTimeout(()=>{$('sugg').innerHTML='';},120));
  if($('qa'))$('qa').onchange=async()=>{showAll=$('qa').checked;try{await load();}catch(e){msg(errText(e),false);return;}renderToday();renderResults();renderCal();};
  card.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.gig){
      if(!confirm('Open this shift up and text the other hosts?'))return;
      b.disabled=true;b.textContent='Sending…';
      try{const r=(await fns.httpsCallable('requestCoverage')({shiftKey:b.dataset.gig})).data;
        const g=shifts.find(x=>x.key===b.dataset.gig);if(g)g.openCalloutId=r.calloutId;
        renderToday();renderResults();
        msg('Done — '+r.sent+' host'+(r.sent===1?'':'s')+' texted'+(r.notTexted?' ('+r.notTexted+' not reachable by text)':'')+'. You\'ll get a text when someone claims it. Until then, the shift is still yours.',true);
      }catch(err){b.disabled=false;b.textContent='I can\'t make this one';msg(errText(err),false);}
    }else if(b.dataset.cancel){
      b.disabled=true;
      try{await fns.httpsCallable('cancelCoverage')({calloutId:b.dataset.cancel});
        shifts.forEach(g=>{if(g.openCalloutId===b.dataset.cancel)g.openCalloutId=null;});renderToday();renderResults();}
      catch(err){b.disabled=false;msg(errText(err),false);}
    }
  });
  renderToday();renderResults();
}
</script></body></html>
