<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Shift — Belladonna</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700&family=Josefin+Sans:wght@200;300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000; --surface: #0d0d0d; --surface2: #141414; --surface3: #1a1a1a;
    --border: rgba(180,150,100,0.16); --border2: rgba(180,150,100,0.32);
    --gold: #c9a96e; --rose2: #b0505a;
    --text: #f0ece0; --text2: #b0a890; --text3: #8a8272;
    --live: #3aaa6a; --live-dim: rgba(58,170,106,0.15);
    --purple-btn: #c9a96e;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Josefin Sans', sans-serif; font-weight: 300; min-height: 100vh; padding: 2rem 1rem; letter-spacing: 0.04em; }
  .form-wrap { max-width: 480px; margin: 0 auto; }
  .form-header { text-align: center; margin-bottom: 2.5rem; position: relative; padding-bottom: 1.5rem; }
  .form-header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .brand { font-family:'Bebas Neue',sans-serif; font-size:2.0rem; font-weight:400; color:var(--text); letter-spacing:0.06em; text-transform: uppercase; padding-right: 0.14em; }
  .form-subtitle { font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--text3); margin-top: 0.3rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), var(--rose2), transparent); }
  .field { margin-bottom: 1.4rem; }
  .field-label { font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text3); display: block; margin-bottom: 0.5rem; }
  .field-input, .field-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.75rem 1rem; font-size: 0.82rem; font-family: 'Josefin Sans', sans-serif; font-weight: 300; letter-spacing: 0.05em; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .field-input:focus, .field-textarea:focus { border-color: var(--gold); }
  .field-input::placeholder, .field-textarea::placeholder { color: var(--text3); }
  .field-textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .venue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .venue-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.8rem; font-size: 0.72rem; color: var(--purple-btn); cursor: pointer; text-align: center; transition: all 0.2s; letter-spacing: 0.05em; font-family: 'Josefin Sans', sans-serif; line-height: 1.3; }
  .venue-chip:hover { border-color: var(--border2); color: var(--text); }
  .venue-chip.selected { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.08); }
  .add-venue-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .add-venue-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.6rem 0.9rem; font-size: 0.75rem; font-family: 'Josefin Sans', sans-serif; outline: none; transition: border-color 0.2s; letter-spacing: 0.05em; }
  .add-venue-input:focus { border-color: var(--gold); }
  .add-venue-input::placeholder { color: var(--text3); }
  .add-btn { background: rgba(201,169,110,0.15); border: 1px solid var(--gold); color: var(--purple-btn); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.7rem; cursor: pointer; font-family: 'Josefin Sans', sans-serif; font-weight: 400; letter-spacing: 0.1em; transition: all 0.2s; white-space: nowrap; }
  .add-btn:hover { background: rgba(201,169,110,0.25); color: var(--text); }
  .divider { height: 1px; background: var(--border); margin: 1.2rem 0; }
  .required { color: var(--rose2); margin-left: 2px; }
  .time-now-btn { display: inline-block; margin-top: 0.5rem; font-size: 0.65rem; font-family: 'Josefin Sans', sans-serif; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; color: var(--purple-btn); background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.3); border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer; transition: all 0.2s; }
  .time-now-btn:hover { background: rgba(201,169,110,0.2); color: var(--text); }
  .status-toggle { display: flex; gap: 0.5rem; }
  .status-btn { flex: 1; padding: 0.8rem; border-radius: 8px; font-size: 0.7rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; font-family: 'Josefin Sans', sans-serif; transition: all 0.2s; border: 1px solid var(--border2); background: var(--surface2); color: var(--purple-btn); }
  .status-btn:hover { color: var(--text); border-color: rgba(201,169,110,0.5); }
  .status-btn.active-sel { border-color: var(--live); color: var(--purple-btn); background: rgba(58,170,106,0.15); }
  .status-btn.inactive-sel { border-color: var(--rose2); color: var(--purple-btn); background: rgba(176,80,112,0.15); }
  .submit-btn { width: 100%; background: rgba(201,169,110,0.1); border: 1px solid var(--gold); color: var(--purple-btn); padding: 1rem; border-radius: 8px; font-size: 0.72rem; font-weight: 400; letter-spacing: 0.35em; text-transform: uppercase; cursor: pointer; font-family: 'Josefin Sans', sans-serif; transition: all 0.25s; margin-top: 0.5rem; }
  .submit-btn:hover { background: rgba(201,169,110,0.2); color: var(--text); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { border-radius: 8px; padding: 0.9rem 1rem; font-size: 0.75rem; letter-spacing: 0.05em; margin-top: 1rem; display: none; line-height: 1.5; }
  .msg-success { background: var(--live-dim); border: 1px solid rgba(58,170,106,0.3); color: #6edd9a; }
  .msg-error { background: rgba(176,80,112,0.12); border: 1px solid rgba(176,80,112,0.3); color: #d07090; }
  :root{--gold2:#e0bc7e;--border-gold:rgba(201,169,110,0.4);--text4:#4a4638;--gold-dim:rgba(201,169,110,0.12);}
  /* additions */
  .submit-btn:hover,.confirm-btn:hover,.seg-btn:hover{background:rgba(201,169,110,0.2);color:var(--text);}
  .submit-btn:disabled,.confirm-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .gig{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.7rem;}
  .gig-t{font-size:.9rem;color:var(--text);letter-spacing:.05em;} .gig-s{font-size:.72rem;color:var(--text3);margin-top:.25rem;letter-spacing:.06em;}
  .gig-tag{display:inline-block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--border2);color:var(--gold);border-radius:6px;padding:.15rem .5rem;margin-top:.5rem;}
  .gig .submit-btn{margin-top:.8rem;padding:.7rem;font-size:.65rem;}
  .warn-btn{border-color:var(--rose2);} .empty{color:var(--text3);font-size:.78rem;text-align:center;padding:1rem 0;}
  .sec{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--text3);margin:1.4rem 0 .7rem;}
  .big{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--text);text-align:center;line-height:1.3;margin:.3rem 0 .2rem;}
  .detail{text-align:center;color:var(--text2);font-size:.82rem;line-height:1.8;letter-spacing:.06em;margin-bottom:1.2rem;}
  .back{display:block;text-align:center;margin-top:1.4rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);text-decoration:none;}
</style></head><body>
<div class="form-wrap">
  <div class="form-header"><div class="brand">Belladonna</div><div class="form-subtitle" style="font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.14em;color:var(--gold2);margin-top:.15rem">Open Shift</div></div>
  <div class="card" id="card"><div class="empty">Loading…</div></div>
  <a class="back" href="host-hub.html">‹ Back to Host Hub</a>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCIfAE1JGHsUGzzVH2pz1Vyj5b5OhA0tDQ",authDomain:"belladonna-hq.firebaseapp.com",projectId:"belladonna-hq",storageBucket:"belladonna-hq.firebasestorage.app",messagingSenderId:"1021873183587",appId:"1:1021873183587:web:def283bb7b5ca48e4f9156"});
const auth=firebase.auth(), fs=firebase.firestore(), fns=firebase.functions();
const GATEWAY_APP_KEY='shifts';
const GW='https://belladonnanights.github.io/belladonna-gateway/accounts.html?return='+encodeURIComponent(location.href)+'&app='+GATEWAY_APP_KEY;
const card=document.getElementById('card');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function pDate(k){const p=String(k).split('-');if(p.length<3)return k;return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function todayKey(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}
function errText(e){return (e&&e.message)?e.message.replace(/^.*?:\s*(?=[A-Z])/,''):'Something went wrong.';}
function say(html){card.innerHTML=html;}
auth.onAuthStateChanged(async user=>{
  if(!user){location.href=GW;return;}
  try{
    const s=await fs.collection('users').doc(user.uid).get();
    const me=s.exists?s.data():{};
    if(me.status==='banned'){say('<div class="empty">This account is currently restricted.</div>');return;}
    if(me.accountType!=='host'&&me.role!=='admin'){say('<div class="empty">This page is for host accounts.</div>');return;}
    start(user,me);
  }catch(e){say('<div class="empty">Could not load your account. Please refresh.</div>');}
});

async function start(user,me){
  const id=new URLSearchParams(location.search).get('c');
  if(!id){say('<div class="empty">This link is missing its shift code.</div>');return;}
  let co;
  try{const s=await fs.collection('shiftCallouts').doc(id).get();if(!s.exists)throw 0;co=s.data();}
  catch(e){say('<div class="empty">That shift is no longer available.</div>');return;}
  const info='<div class="big">'+esc(co.venue)+'</div><div class="detail">'+esc(pDate(co.gigDate))+(co.time?' · '+esc(co.time):'')+(co.kind?'<br>'+esc(co.kind):'')+'</div>';
  if(co.status==='claimed'){say(info+'<div class="msg msg-error" style="display:block">'+(co.claimedByUid===user.uid?'You claimed this shift — it\'s yours!':'Too late — '+esc(co.claimedByName||'another host')+' already claimed it.')+'</div>');return;}
  if(co.status!=='open'){say(info+'<div class="msg msg-error" style="display:block">This shift is no longer open.</div>');return;}
  if(co.originalHostUid===user.uid){say(info+'<div class="msg msg-error" style="display:block">This is your own shift.</div>');return;}
  say(info+'<button class="submit-btn" id="go">Claim This Shift</button><div class="msg" id="msg"></div>');
  const msg=(t,ok)=>{const m=document.getElementById('msg');m.className='msg '+(ok?'msg-success':'msg-error');m.textContent=t;m.style.display='block';};
  document.getElementById('go').onclick=async function(){
    this.disabled=true;this.textContent='Claiming…';
    try{await fns.httpsCallable('claimShift')({calloutId:id});
      say(info+'<div class="msg msg-success" style="display:block">It\'s yours! The schedule has been updated. See you there.</div>');
    }catch(e){this.disabled=false;this.textContent='Claim This Shift';msg(errText(e),false);}
  };
}

</script></body></html>
