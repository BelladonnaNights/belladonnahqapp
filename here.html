<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonight — Belladonna</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#000;--surface:#0d0d0d;--surface2:#141414;--border:rgba(201,169,110,0.2);--border2:rgba(201,169,110,0.4);--gold:#c9a96e;--text:#f0ece0;--text2:#b0a890;--text3:#8a8272;}
  body{background:var(--bg);color:var(--text);font-family:'Josefin Sans',sans-serif;font-weight:300;min-height:100vh;letter-spacing:0.04em;}
  .page{max-width:520px;margin:0 auto;padding:2.4rem 1.3rem 3rem;}
  .hub-brand{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--gold);letter-spacing:0.18em;text-transform:uppercase;text-align:center;}
  .hub-sub{font-size:0.68rem;letter-spacing:0.45em;text-transform:uppercase;color:var(--text3);margin-top:0.2rem;text-align:center;}
  .hub-ornament{color:#3a3428;font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:0.4em;margin:0.7rem 0 1.5rem;text-align:center;}
  .venue{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--text);text-align:center;margin-bottom:0.2rem;}
  .date{font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:1.6rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.1rem 1rem;margin-bottom:1rem;}
  .card.cancelled{opacity:.55}
  .k-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin-bottom:.2rem}
  .k-name{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--gold);letter-spacing:.06em}
  .k-time{font-size:.78rem;color:var(--text2);letter-spacing:.1em;text-transform:uppercase}
  .k-theme{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--text2);margin-bottom:.8rem}
  .btn{display:block;text-decoration:none;text-align:center;background:transparent;color:var(--gold);border:1px solid var(--border2);border-radius:10px;padding:.85rem 1rem;margin-top:.6rem;font-family:'Josefin Sans',sans-serif;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transition:background .2s}
  .btn:hover,.btn:active{background:rgba(201,169,110,.12)}
  .btn small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--text3);font-weight:300;margin-bottom:.2rem}
  .note{font-size:.8rem;color:var(--text3);line-height:1.6;margin-top:.6rem}
  .msg{text-align:center;color:var(--text2);line-height:1.7;font-size:.9rem;margin:2rem 0}
  .up{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:.6rem 0;font-size:.85rem;color:var(--text2)}
  .up b{color:var(--text);font-weight:400}
  .foot{margin-top:2rem;text-align:center;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3)}
  .choice{display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:1.2rem 1.2rem;margin-bottom:1rem;color:var(--text);font-family:inherit;letter-spacing:inherit;text-decoration:none}
  .choice:active,.choice:hover{background:rgba(201,169,110,.10)}
  .choice .c-t{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold);letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
  .choice .c-s{font-size:.8rem;color:var(--text2);margin-top:.35rem;line-height:1.5}
  .choice.primary{border-color:var(--gold);background:rgba(201,169,110,.08)}
  .back{background:none;border:none;color:var(--text3);font-family:inherit;letter-spacing:.14em;text-transform:uppercase;font-size:.68rem;cursor:pointer;margin-bottom:1rem;padding:.2rem 0}
  .day{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.8rem}
  .day-h{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:.4rem}
  .ev{padding:.45rem 0;border-top:1px solid var(--border)}.day-h+.ev{border-top:none}
  .ev-n{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.05rem}.ev-n span{font-family:'Josefin Sans',sans-serif;font-size:.72rem;color:var(--text2);letter-spacing:.1em;margin-left:.4rem}
  .ev-d{font-size:.82rem;color:var(--text2);line-height:1.55;margin-top:.1rem}
  .srch{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:.8rem 1rem;color:var(--text);font-family:inherit;font-size:.9rem;letter-spacing:.04em;margin-bottom:.9rem;outline:none}
  .srch:focus{border-color:var(--gold)}
  .vrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;margin-bottom:.55rem;color:var(--text);font-family:'Playfair Display',serif;font-size:1.05rem;letter-spacing:.04em}
  .vrow:active,.vrow:hover{background:rgba(201,169,110,.10)}
  .vrow.cur{border-color:var(--gold);color:var(--gold)}
  .vrow span{font-family:'Josefin Sans',sans-serif;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
  .pills{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
  .pill{background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:99px;padding:.35rem .8rem;font-family:inherit;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  .pill.on{background:rgba(201,169,110,.16);color:var(--gold);border-color:var(--gold)}
  .ev-v{display:inline-block;margin-top:.2rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:1px dotted var(--text3);background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;padding:0}
  .more{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--border)}
  .more-h{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:.7rem}
</style>
</head>
<body>
<div class="page">
  <div class="hub-brand">Belladonna</div>
  <div class="hub-sub">Audio Alchemies</div>
  <div class="hub-ornament">&#10022; &#10022; &#10022;</div>
  <div id="main"><div class="msg">Finding out what's on tonight&hellip;</div></div>
  <div class="foot">belladonnanights.com</div>
</div>
<script>
  // Where things open. here.html lives next to karaoke-list.html, so that link is relative.
  var API = 'https://us-central1-belladonna-hq.cloudfunctions.net/venueTonight';
  var BINGO_APP = 'https://belladonnanights.github.io/bingo/app.html?id=';
  var KARAOKE_LIST = 'karaoke-list.html?id=';
  var TRIVIA_PLAY = 'https://belladonnanights.github.io/belladonnatrivia/play.html?g=';
  var pendingTrivia = false;
  var CUR = {venue:'', date:''};
  // Same recipe the Bingo app uses, so players and the host land in one shared game
  function venueToken(n){ return String(n||'').toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]/g,''); }
  function bingoPlayUrl(id){ return BINGO_APP+encodeURIComponent(id)+'&play&session='+encodeURIComponent(id+'_'+venueToken(CUR.venue)+'-'+CUR.date); }

  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function niceDate(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
  function shortDate(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }

  function cardFor(n, links){
    var title = n.kind==='Bingo' ? 'Music Bingo' : (n.label || n.kind);
    var h = '<div class="card'+(n.cancelled?' cancelled':'')+'"><div class="k-head"><div class="k-name">'+esc(title)+'</div><div class="k-time">'+esc(n.time||'')+'</div></div>';
    if(n.cancelled){ return h + '<div class="note">Tonight\'s '+esc(title)+' has been cancelled.</div></div>'; }
    if(n.theme && n.kind!=='Bingo') h += '<div class="k-theme">'+esc(n.theme)+'</div>';
    if(n.kind==='Bingo'){
      var rounds = (n.bingo && n.bingo.rounds) || [];
      if(rounds.length){
        var nowOne = rounds.filter(function(r){return r.now;}).length;
        rounds.forEach(function(r,i){ var u=bingoPlayUrl(r.id); if(!nowOne || r.now) links.push(u); var lab = r.now ? 'Playing now' : (r.round ? 'Round '+r.round : 'Round '+(i+1)); h += '<a class="btn" href="'+u+'"><small>'+lab+'</small>'+esc(r.title)+'</a>'; });
        h += '<div class="note">Tap a round to open your bingo card and play on your phone.</div>';
      } else h += '<div class="note">Tonight\'s categories aren\'t posted yet &mdash; ask your host and they\'ll get you set up.</div>';
    } else if(n.kind==='Karaoke'){
      if(n.karaoke){ var u=KARAOKE_LIST+encodeURIComponent(n.karaoke.id); links.push(u); h += '<a class="btn" href="'+u+'"><small>Tonight\'s list</small>Browse the song list</a>'; }
      else h += '<div class="note">Karaoke tonight! Ask your host to add your song to the line-up.</div>';
    } else if(n.kind==='Trivia'){
      var tg = n.trivia || {state:'none'};
      if(tg.state==='live' && tg.gameId){ var tu=TRIVIA_PLAY+encodeURIComponent(tg.gameId); links.push(tu); h += '<a class="btn" href="'+tu+'"><small>The game is on</small>Join Trivia</a><div class="note">Pick a team name and you\'re in.</div>'; }
      else if(tg.state==='ready' || tg.state==='waiting'){ pendingTrivia = true; h += '<div class="note">Your host is getting set up. This button turns into <b style="color:var(--gold);font-weight:400">Join Trivia</b> the moment the game starts &mdash; keep this page open.</div>'; }
      else { h += '<div class="note">Trivia tonight! Scan the QR code on the TV screen to join the game, then pick your team name.</div>'; }
    }
    return h + '</div>';
  }

  var D = null;
  function kindName(n){ return n.kind==='Bingo' ? 'Music Bingo' : (n.label || n.kind); }
  function viewName(){ var h=(location.hash||'').replace('#',''); return (h==='play'||h==='upcoming'||h==='venues'||h==='all') ? h : 'home'; }
  function go(v){ location.hash = v==='home' ? '' : v; }   // hashchange re-renders; the phone's back button works

  function head(d){ return '<div class="venue">'+esc(d.venue)+'</div><div class="date">'+esc(niceDate(d.date))+'</div>'; }

  function homeView(d){
    var live = (d.nights||[]).filter(function(n){return !n.cancelled;});
    var h = head(d);
    if(live.length){
      var names = live.map(function(n){ return kindName(n)+(n.time?' &middot; '+esc(n.time):''); }).join('<br>');
      var nm = live.map(function(n){ return esc(kindName(n)); });
      h += '<button class="choice primary" onclick="go(\'play\')"><div class="c-t">Play Tonight <span>&rarr;</span></div><div class="c-s">'+names+'</div></button>';
    } else {
      h += '<div class="msg" style="margin:.4rem 0 1.2rem">Nothing is scheduled here tonight.</div>';
    }
    h += '<button class="choice" onclick="location.href=\'shoutout.html?v=\'+encodeURIComponent(slug)"><div class="c-t">Shout-Outs &amp; Song Requests <span>&rarr;</span></div><div class="c-s">Dedicate a message to the big screen, or request a song for the interim music.</div></button>';
    var more = (d.ahead||[]).length;
    h += '<button class="choice" onclick="go(\'upcoming\')"><div class="c-t">Upcoming Events <span>&rarr;</span></div><div class="c-s">'+(more ? 'See what\'s coming up at '+esc(d.venue)+' &mdash; nights, themes and bingo categories.' : 'Nothing else is posted yet &mdash; check back soon.')+'</div></button>';
    return h + moreBlock();
  }

  function upcomingView(d){
    var h = '<button class="back" onclick="go(\'home\')">&larr; Back</button>' + head(d).replace(/<div class="date">.*<\/div>/,'<div class="date">Coming up</div>');
    var ahead = d.ahead || [];
    if(!ahead.length) return h + '<div class="msg">Nothing else is posted yet.<br>Check back soon.</div>' + moreBlock();
    ahead.forEach(function(day){
      h += '<div class="day"><div class="day-h">'+esc(niceDate(day.date))+'</div>';
      day.nights.forEach(function(n){
        h += '<div class="ev"><div class="ev-n">'+esc(kindName(n))+(n.time?'<span>'+esc(n.time)+'</span>':'')+'</div>';
        var det = [];
        if(n.theme) det.push(esc(n.theme));
        if(n.kind==='Bingo' && n.bingo && n.bingo.rounds && n.bingo.rounds.length) det.push(n.bingo.rounds.map(function(r,i){ return 'Round '+(i+1)+': '+esc(r.title); }).join('<br>'));
        else if(n.kind==='Bingo') det.push('Categories to be announced');
        if(n.kind==='Karaoke' && n.karaoke && n.karaoke.name && n.karaoke.name!==n.theme) det.push(esc(n.karaoke.name));
        if(det.length) h += '<div class="ev-d">'+det.join('<br>')+'</div>';
        h += '</div>';
      });
      h += '</div>';
    });
    return h + moreBlock();
  }

  // ── Another venue / everything everywhere ──
  var RTDB = 'https://belladonna-hq-default-rtdb.firebaseio.com/';
  function slugOf(name){ return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function pickVenue(slug){ location.href = location.pathname + '?v=' + encodeURIComponent(slug); }
  function moreBlock(){
    return '<div class="more"><div class="more-h">Looking for somewhere else?</div>'
      + '<button class="choice" onclick="go(\'venues\')"><div class="c-t">See Another Venue <span>&rarr;</span></div><div class="c-s">Pick any Belladonna venue to see what\'s on there.</div></button>'
      + '<button class="choice" onclick="go(\'all\')"><div class="c-t">All Upcoming Events <span>&rarr;</span></div><div class="c-s">Everything coming up at every Belladonna venue, in one list.</div></button></div>';
  }
  var VENUES = null;   // [{name, slug}]
  function loadVenues(cb){
    if(VENUES) return cb(VENUES);
    try{ var c = sessionStorage.getItem('bn_venues'); if(c){ VENUES = JSON.parse(c); return cb(VENUES); } }catch(e){}
    var paths = ['trivia/planner/venues','bingo/landing/venues','trivia/planner/karaokeVenues'];
    var seen = {}, list = [], left = paths.length;
    function done(){ if(--left) return; list.sort(function(a,b){ return a.name.localeCompare(b.name); }); VENUES = list; try{ sessionStorage.setItem('bn_venues', JSON.stringify(list)); }catch(e){} cb(list); }
    paths.forEach(function(path){
      fetch(RTDB+path+'.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(o){
        Object.keys(o||{}).forEach(function(k){ var v=o[k]; if(!v||!v.name||v.inactive) return; var sl=slugOf(v.name); if(sl && !seen[sl]){ seen[sl]=1; list.push({name:String(v.name).trim(), slug:sl}); } });
      }).catch(function(){}).then(done);
    });
  }
  function venuesView(d){
    var h = '<button class="back" onclick="go(\'home\')">&larr; Back</button><div class="venue">Choose a venue</div><div class="date">Belladonna venues</div>'
      + '<input class="srch" id="vsearch" type="search" autocomplete="off" placeholder="Search venues&hellip;" oninput="filterVenues()"><div id="vlist"><div class="msg">Loading venues&hellip;</div></div>';
    setTimeout(function(){ loadVenues(function(){ filterVenues(); }); },0);
    return h;
  }
  function filterVenues(){
    var box = document.getElementById('vlist'); if(!box||!VENUES) return;
    var q = ((document.getElementById('vsearch')||{}).value||'').toLowerCase().trim();
    var cur = D ? slugOf(D.venue) : '';
    var l = VENUES.filter(function(v){ return !q || v.name.toLowerCase().indexOf(q)>=0; });
    box.innerHTML = l.length ? l.map(function(v){ return '<button class="vrow'+(v.slug===cur?' cur':'')+'" onclick="pickVenue(\''+v.slug.replace(/'/g,"\\'")+'\')">'+esc(v.name)+(v.slug===cur?'<span>You are here</span>':'<span>View &rarr;</span>')+'</button>'; }).join('') : '<div class="msg">No venues match.</div>';
  }
  function showVenuePicker(){ var m=document.getElementById('main'); m.innerHTML = venuesView(null).replace(/<button class="back".*?<\/button>/,''); }
  var ALL = null, ALL_KIND = 'All';
  function allView(d){
    var h = '<button class="back" onclick="go(\'home\')">&larr; Back</button><div class="venue">All upcoming events</div><div class="date">Every Belladonna venue</div>'
      + '<div id="allbox"><div class="msg">Gathering events from every venue&hellip;</div></div>';
    setTimeout(loadAll,0);
    return h;
  }
  function loadAll(){
    if(ALL) return paintAll();
    try{ var c = JSON.parse(sessionStorage.getItem('bn_all')||'null'); if(c && Date.now()-c.t < 300000){ ALL = c.data; return paintAll(); } }catch(e){}
    loadVenues(function(vs){
      var items = [], idx = 0, active = 0, finished = 0, total = vs.length;
      if(!total){ ALL = []; return paintAll(); }
      function prog(){ var b=document.getElementById('allbox'); if(b && viewName()==='all' && !ALL) b.innerHTML = '<div class="msg">Gathering events&hellip; '+finished+' of '+total+' venues</div>'; }
      function next(){
        while(active < 6 && idx < total){
          (function(v){ active++;
            fetch(API+'?v='+encodeURIComponent(v.slug)).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
              if(!d || !d.found) return;
              var days = [{date:d.date, nights:d.nights||[]}].concat(d.ahead||[]);
              days.forEach(function(day){ (day.nights||[]).forEach(function(n){ if(!n.cancelled) items.push({date:day.date, venue:d.venue||v.name, slug:v.slug, n:n}); }); });
            }).catch(function(){}).then(function(){ active--; finished++; prog(); if(finished>=total){ finish(); } else next(); });
          })(vs[idx++]);
        }
      }
      function finish(){
        items.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.venue.localeCompare(b.venue)); });
        ALL = items; try{ sessionStorage.setItem('bn_all', JSON.stringify({t:Date.now(), data:items})); }catch(e){}
        paintAll();
      }
      next();
    });
  }
  function setKind(k){ ALL_KIND = k; paintAll(); }
  function paintAll(){
    var box = document.getElementById('allbox'); if(!box || viewName()!=='all' || !ALL) return;
    var kinds = ['All','Bingo','Karaoke','Trivia'];
    var h = '<div class="pills">'+kinds.map(function(k){ return '<button class="pill'+(k===ALL_KIND?' on':'')+'" onclick="setKind(\''+k+'\')">'+(k==='Bingo'?'Music Bingo':k)+'</button>'; }).join('')+'</div>';
    var list = ALL.filter(function(x){ return ALL_KIND==='All' || x.n.kind===ALL_KIND; });
    if(!list.length){ box.innerHTML = h+'<div class="msg">Nothing posted yet.<br>Check back soon.</div>'; return; }
    var lastDate = '';
    list.forEach(function(x){
      if(x.date!==lastDate){ if(lastDate) h += '</div>'; h += '<div class="day"><div class="day-h">'+esc(niceDate(x.date))+'</div>'; lastDate = x.date; }
      var n = x.n, det = [];
      if(n.theme && n.kind!=='Bingo') det.push(esc(n.theme));
      if(n.kind==='Bingo' && n.bingo && n.bingo.rounds && n.bingo.rounds.length) det.push(n.bingo.rounds.map(function(r,i){ return 'Round '+(i+1)+': '+esc(r.title); }).join('<br>'));
      h += '<div class="ev"><div class="ev-n">'+esc(kindName(n))+(n.time?'<span>'+esc(n.time)+'</span>':'')+'</div>'
        + '<button class="ev-v" onclick="pickVenue(\''+x.slug.replace(/'/g,"\\'")+'\')">'+esc(x.venue)+'</button>'
        + (det.length?'<div class="ev-d">'+det.join('<br>')+'</div>':'') + '</div>';
    });
    box.innerHTML = h+'</div>';
  }

  function playView(d){
    var live = (d.nights||[]);
    var h = '<button class="back" onclick="go(\'home\')">&larr; Back</button>' + head(d);
    if(!live.length) return h + '<div class="msg">Nothing is scheduled here tonight.</div>';
    var links = []; pendingTrivia = false;
    h += live.map(function(n){ return cardFor(n, links); }).join('');
    return h;
  }

  function render(d){
    var main = document.getElementById('main');
    if(!d.found){ main.innerHTML = '<div class="msg">We couldn\'t find that venue.</div><button class="choice primary" onclick="showVenuePicker()"><div class="c-t">Choose A Venue <span>&rarr;</span></div></button>'; return; }
    D = d; CUR.venue=d.venue; CUR.date=d.date;
    paint();
  }
  function paint(){
    if(!D) return;
    var v = viewName(), main = document.getElementById('main');
    pendingTrivia = false;
    main.innerHTML = v==='play' ? playView(D) : v==='upcoming' ? upcomingView(D) : v==='venues' ? venuesView(D) : v==='all' ? allView(D) : homeView(D);
    window.scrollTo(0,0);
    // only the Play screen needs to keep refreshing (trivia flips to "Join Trivia" by itself)
    if(v==='play' && pendingTrivia) setTimeout(function(){ if(viewName()==='play') load(true); }, 10000);
  }
  window.addEventListener('hashchange', paint);

  var slug = new URLSearchParams(location.search).get('v');
  if(!slug){ document.getElementById('main').innerHTML = '<div class="msg">This link is missing its venue.<br>Scan the QR code at your table again, or pick a venue below.</div><button class="choice primary" onclick="showVenuePicker()"><div class="c-t">Choose A Venue <span>&rarr;</span></div></button>'; }
  else load();
  function load(quiet){
    fetch(API+'?v='+encodeURIComponent(slug)).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(render)
      .catch(function(){ if(!quiet && !D) document.getElementById('main').innerHTML = '<div class="msg">Couldn\'t load tonight\'s info.<br>Check your connection and scan again.</div>'; });
  }
</script>
</body>
</html>
