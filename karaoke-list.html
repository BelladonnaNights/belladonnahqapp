<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Song List — Belladonna</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Josefin+Sans:wght@200;300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#000000;--surface:#0d0d0d;--surface2:#141414;--surface3:#1a1a1a;
    --border:rgba(180,150,100,0.16);--border2:rgba(180,150,100,0.34);--border-gold:rgba(201,169,110,0.4);
    --gold:#c9a96e;--gold2:#e0bc7e;--gold-dim:rgba(201,169,110,0.12);
    --text:#f0ece0;--text2:#b8ad98;--text3:#8a8272;--text4:#4a4638;
  }
  body{background:var(--bg);color:var(--text);font-family:'Josefin Sans',sans-serif;font-weight:300;min-height:100vh;letter-spacing:0.04em;}
  .page{max-width:520px;margin:0 auto;padding:2.4rem 1.3rem 3rem;}

  /* Header — same as every Belladonna page: white BELLADONNA, gold page name */
  .hub-brand{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;font-weight:400;color:#fff;letter-spacing:0.06em;line-height:1;text-align:center;text-transform:uppercase;}
  .hub-sub{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;font-weight:400;letter-spacing:0.1em;line-height:1.05;text-align:center;text-transform:uppercase;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold);}
  .hub-ornament{display:none;}
  .head{margin-bottom:1.8rem;}

  /* List title */
  .theme-title{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:600;color:var(--text);text-align:center;line-height:1.1;margin-top:1.8rem;letter-spacing:0.02em;}
  .theme-alt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--text3);text-align:center;margin-top:0.2rem;}
  .theme-sub{font-size:0.62rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--gold);text-align:center;margin:0.7rem 0 1.4rem;}

  .search-wrap{margin-bottom:1rem;position:sticky;top:0;z-index:5;background:var(--bg);padding:0.4rem 0 0.6rem;}
  input#songSearch{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-family:'Josefin Sans',sans-serif;font-size:0.9rem;padding:0.7rem 0.9rem;letter-spacing:0.04em;}
  input#songSearch:focus{outline:none;border-color:var(--gold);box-shadow:0 0 18px rgba(201,169,110,0.15);}
  input#songSearch::placeholder{color:var(--text3);}
  .song-count{font-size:0.62rem;letter-spacing:0.2em;color:var(--text3);text-align:center;margin-bottom:0.8rem;text-transform:uppercase;}

  /* The list itself: no boxes — just type, hairlines, and section titles */
  .song-list{display:flex;flex-direction:column;}
  .sec-title{font-family:'Cinzel',serif;font-weight:600;font-size:0.72rem;letter-spacing:0.26em;text-transform:uppercase;color:var(--gold);padding:1.7rem 0 0.55rem;border-bottom:1px solid var(--border-gold);margin-bottom:0.15rem;}
  .song-list > .sec-title:first-child{padding-top:0.4rem;}
  .song-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:0.62rem 0;border-bottom:1px solid var(--border);}
  .song-title{color:var(--text);font-size:0.92rem;font-weight:400;letter-spacing:0.03em;line-height:1.35;}
  .song-artist{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.08rem;color:var(--text2);text-align:right;flex-shrink:0;max-width:46%;line-height:1.25;letter-spacing:0.02em;}
  .loading,.msg-empty{text-align:center;color:var(--text3);font-size:0.78rem;letter-spacing:0.1em;padding:3rem 0;}
</style>
</head>
<body>
<div class="page">
  <div class="head"><div class="hub-brand">Belladonna</div><div class="hub-sub">Karaoke Night</div></div>

  <div id="main"><div class="loading">Loading song list…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({apiKey:"AIzaSyCIfAE1JGHsUGzzVH2pz1Vyj5b5OhA0tDQ",authDomain:"belladonna-hq.firebaseapp.com",databaseURL:"https://belladonna-hq-default-rtdb.firebaseio.com",projectId:"belladonna-hq",storageBucket:"belladonna-hq.firebasestorage.app",messagingSenderId:"1021873183587",appId:"1:1021873183587:web:def283bb7b5ca48e4f9156"});
  const db = firebase.firestore();

  // Parsed list: [{head:'Section title'} | {title,artist}] in the order the host typed it.
  let allItems=[];

  function getParam(name){ return new URLSearchParams(window.location.search).get(name); }

  // ── How a line becomes a heading or a song ──────────────────────────────
  // Heading:  a line that starts with #   (# Bands & Artists of Buffy)
  //           or is wrapped in ==  ==     (== Buffy Songs ==)
  //           or — so older lists keep working — an ALL-CAPS line with no " - " in it.
  // Song:     "Title - Artist"  (a leading "- " or "• " bullet is ignored).
  function parseKaraokeLine(raw){
    let t=String(raw==null?'':raw).trim();
    if(!t) return null;
    let m=t.match(/^#+\s*(.+)$/) || t.match(/^=+\s*(.+?)\s*=+$/);
    if(m) return {head:m[1].trim()};
    t=t.replace(/^[-–—•*]\s+/,'');
    const parts=t.split(/\s+[-–—]\s+/);
    if(parts.length===1 && /[A-Z]/.test(t) && t===t.toUpperCase() && t.length>=4 && t.length<=70) return {head:t};
    return parts.length>1 ? {title:parts[0].trim(),artist:parts.slice(1).join(' - ').trim()} : {title:t,artist:''};
  }
  function parseKaraokeLines(lines){ return (lines||[]).map(parseKaraokeLine).filter(Boolean); }
  const byArtist=(a,b)=>{
    const an=(a.artist||a.title).toLowerCase(), bn=(b.artist||b.title).toLowerCase();
    return an<bn?-1:an>bn?1:(a.title.toLowerCase()<b.title.toLowerCase()?-1:1);
  };
  // No headings -> the old alphabetical-by-artist list. With headings -> keep the
  // host's section order and sort songs by artist inside each section.
  function arrangeItems(items){
    if(!items.some(i=>i.head)) return items.slice().sort(byArtist);
    const out=[]; let bucket=[];
    const flush=()=>{ out.push(...bucket.sort(byArtist)); bucket=[]; };
    items.forEach(i=>{ if(i.head){ flush(); out.push(i); } else bucket.push(i); });
    flush(); return out;
  }

  async function loadPlanner(id){
    const main=document.getElementById('main');
    try{
      const snap=await firebase.database().ref('publicKaraoke/'+id).once('value');
      const v=snap.val();
      if(!v){ main.innerHTML='<div class="msg-empty">That song list couldn\'t be found.</div>'; return; }
      allItems=arrangeItems(parseKaraokeLines(Array.isArray(v.songs)?v.songs:[]));
      renderPage({title:v.name||'Karaoke',alt:v.altName||''});
    }catch(e){ main.innerHTML='<div class="msg-empty">Could not load the song list.</div>'; }
  }

  async function load(){
    const planId=getParam('id');
    if(planId){ return loadPlanner(planId); }
    const listId=getParam('list');
    const main=document.getElementById('main');
    if(!listId){ main.innerHTML='<div class="msg-empty">No song list specified.</div>'; return; }
    try{
      const doc=await db.collection('karaoke_lists').doc(listId).get();
      if(!doc.exists){ main.innerHTML='<div class="msg-empty">That song list couldn\'t be found.</div>'; return; }
      const data=doc.data();
      allItems=(data.songs||[]).map(s=>({title:s.title||'',artist:s.artist||''})).filter(s=>s.title).sort(byArtist);
      renderPage({title:data.title||'Karaoke',alt:''});
    }catch(e){ main.innerHTML='<div class="msg-empty">Could not load the song list.</div>'; }
  }

  function songCount(){ return allItems.filter(i=>!i.head).length; }
  function renderPage(data){
    const main=document.getElementById('main');
    const n=songCount();
    main.innerHTML=`
      <div class="theme-title">${escapeHtml(data.title||'Karaoke')}</div>
      ${data.alt?`<div class="theme-alt">${escapeHtml(data.alt)}</div>`:''}
      <div class="theme-sub">${n} song${n===1?'':'s'}</div>
      <div class="search-wrap"><input type="text" id="songSearch" placeholder="Search songs or artists…"></div>
      <div class="song-count" id="songCount"></div>
      <div class="song-list" id="songList"></div>
    `;
    document.getElementById('songSearch').addEventListener('input',e=>renderSongs(e.target.value));
    renderSongs('');
  }

  function renderSongs(query){
    const q=query.trim().toLowerCase();
    const hit=s=>!q||(s.title||'').toLowerCase().includes(q)||(s.artist||'').toLowerCase().includes(q);
    // keep a section title only if something under it matches
    const shown=[]; let pendingHead=null, matches=0;
    allItems.forEach(i=>{
      if(i.head){ pendingHead=i; return; }
      if(!hit(i)) return;
      if(pendingHead){ shown.push(pendingHead); pendingHead=null; }
      shown.push(i); matches++;
    });
    document.getElementById('songCount').textContent=q?`${matches} match${matches===1?'':'es'}`:'';
    const list=document.getElementById('songList');
    if(!matches){ list.innerHTML='<div class="msg-empty">No songs match that search.</div>'; return; }
    list.innerHTML=shown.map(i=>i.head
      ?`<div class="sec-title">${escapeHtml(i.head)}</div>`
      :`<div class="song-row"><span class="song-title">${escapeHtml(i.title||'')}</span><span class="song-artist">${escapeHtml(i.artist||'')}</span></div>`).join('');
  }

  function escapeHtml(str){
    const d=document.createElement('div');
    d.textContent=str;
    return d.innerHTML;
  }

  load();
</script>
</body>
</html>
